name: Production

# MH-OPS-006 / MH-OPS-010 — Admin SPA → Cloudflare Pages (Direct Upload project).
#
# pull request      → checks.yml only; this workflow never runs for pull requests
# push to main      → checks (no deploy)
# manual dispatch   → checks → GitHub Environment "production" approval
#                     → production build with guarded VITE_* → bundle checks
#                     → wrangler pages deploy
#
# `develop` never deploys to production. The Pages project must use Direct Upload
# (no Git integration) so Cloudflare cannot publish unreviewed commits.
#
# Environment "production" must define:
#   secrets: CLOUDFLARE_API_TOKEN (Pages:Edit only), CLOUDFLARE_ACCOUNT_ID
#   vars:    CF_PAGES_PROJECT, VITE_API_BASE_URL, VITE_BACKEND_ORIGIN, VITE_FRONTEND_URL
#
# VITE_API_BASE_URL must be absolute: the CSRF cookie origin and every API call
# derive from it, and Pages does not proxy /api.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this main commit to Cloudflare Pages production (requires approval)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to Cloudflare Pages
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_BACKEND_ORIGIN: ${{ vars.VITE_BACKEND_ORIGIN }}
      VITE_FRONTEND_URL: ${{ vars.VITE_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name in environment 'production'"; missing=1; fi
          done
          exit "$missing"

      # Values are public but are not echoed; errors name the variable only.
      - name: Guard production build variables
        run: |
          set -euo pipefail
          fail=0
          dev='localhost|127\.0\.0\.1|example\.(com|org|net)'
          check() {
            local name="$1" pattern="$2" hint="$3"
            local value="${!name}"
            if [[ -z "$value" ]]; then
              echo "::error::$name is not set"; fail=1
            elif [[ ! "$value" =~ $pattern ]] || [[ "$value" =~ $dev ]]; then
              echo "::error::$name must be $hint"; fail=1
            fi
          }
          check VITE_API_BASE_URL '^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~-]+)+$' "an absolute production https:// API URL"
          check VITE_BACKEND_ORIGIN '^https://[A-Za-z0-9.-]+$' "a production https:// origin without a path"
          check VITE_FRONTEND_URL '^https://[A-Za-z0-9.-]+$' "a production https:// origin without a path"
          exit "$fail"

      - run: npm ci
      - run: npm run build

      # The backend smoke test (scripts/smoke.sh) requires the Admin shell to carry noindex.
      - name: Verify production bundle
        run: |
          set -euo pipefail
          if grep -rEl 'localhost:8000|127\.0\.0\.1:8000' dist; then
            echo "::error::Production bundle references a development origin"
            exit 1
          fi
          grep -q '<div id="root"' dist/index.html || { echo "::error::dist/index.html has no div#root"; exit 1; }
          grep -qi 'noindex' dist/index.html || { echo "::error::dist/index.html is missing noindex"; exit 1; }
          grep -rqF -- "$VITE_API_BASE_URL" dist/assets || { echo "::error::Bundle does not contain VITE_API_BASE_URL"; exit 1; }

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
